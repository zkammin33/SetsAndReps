<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<title>Log a Set — GET SWOLE</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<nav>
  <a href="./" class="nav-brand">GET SWOLE</a>
  <div class="nav-links">
    <a href="./">History</a>
    <a href="./log.html" class="active">Log</a>
    <a href="./workouts.html">Workouts</a>
    <a href="./exercises.html">Exercises</a>
    <a href="./backup.html">Backup</a>
  </div>
</nav>

<main>
  <div class="page-header">
    <h1>TODAY'S <span>SESSION</span></h1>
  </div>

  <section class="card">
    <div class="form-group" style="margin-bottom:0">
      <label for="workout-select">Today's Workout</label>
      <select id="workout-select"></select>
    </div>
  </section>

  <section id="session" hidden></section>

  <section id="freeform" class="card" hidden>
    <div class="form-group">
      <label for="exercise">Exercise</label>
      <input id="exercise" placeholder="Bench Press" autocapitalize="words">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="weight">Weight</label>
        <input id="weight" type="number" inputmode="decimal" placeholder="0">
      </div>
      <div class="form-group">
        <label for="reps">Reps</label>
        <input id="reps" type="number" inputmode="numeric" placeholder="0">
      </div>
      <div class="form-group">
        <label>&nbsp;</label>
        <button id="add" class="btn btn-primary btn-block">Log Set</button>
      </div>
    </div>
  </section>

  <p id="note" class="note">&nbsp;</p>
</main>

<script src="./js/exercises.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
