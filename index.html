<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Lift</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<h1>Lift</h1>

<input id="exercise" placeholder="Exercise" autocapitalize="words">
<div class="row">
  <input id="weight" type="number" inputmode="decimal" placeholder="Weight">
  <input id="reps" type="number" inputmode="numeric" placeholder="Reps">
</div>
<button id="add">Log set</button>

<h2>History</h2>
<ul id="history"></ul>

<h2>Backup</h2>
<button id="export">Export backup</button>
<label for="import-file">Restore from a backup file</label>
<input id="import-file" type="file" accept=".json,application/json">
<p id="note"><small>&nbsp;</small></p>

<script src="./js/app.js"></script>
</body>
</html>
