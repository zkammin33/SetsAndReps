<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<title>Workouts — GET SWOLE</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<nav>
  <a href="./" class="nav-brand">GET SWOLE</a>
  <div class="nav-links">
    <a href="./">History</a>
    <a href="./log.html">Log</a>
    <a href="./workouts.html" class="active">Workouts</a>
    <a href="./exercises.html">Exercises</a>
    <a href="./backup.html">Backup</a>
  </div>
</nav>

<main>
  <div class="page-header">
    <h1>MY <span>WORKOUTS</span></h1>
    <button id="new-workout" class="btn btn-primary">+ New Workout</button>
  </div>

  <section id="workout-editor" class="card" hidden>
    <h2 id="editor-title">New Workout</h2>
    <div class="form-group">
      <label for="workout-label">Label</label>
      <input id="workout-label" placeholder="C — Legs" autocapitalize="words">
    </div>

    <label>Exercises</label>
    <div id="exercise-rows"></div>

    <button id="add-exercise" class="btn btn-ghost btn-sm">+ Add Exercise</button>

    <hr class="divider">
    <div class="editor-actions">
      <button id="save-workout" class="btn btn-primary">Save Workout</button>
      <button id="cancel-workout" class="btn btn-ghost">Cancel</button>
    </div>
  </section>

  <section id="workout-list"></section>

  <div id="workouts-empty" class="card empty" hidden>
    <p>No workouts yet. Build one, label it, then pick it on the Log tab.</p>
  </div>

  <p id="note" class="note">&nbsp;</p>
</main>

<script src="./js/app.js"></script>
</body>
</html>
